version: 2.1

# Orbs
orbs:
  android: circleci/android@3.2.0
  ruby: circleci/ruby@4.0.0

# The orb's default cache key only looks at build.gradle* and settings.gradle*, so dependency
# bumps in the version catalog or a new Gradle wrapper would otherwise restore a stale cache.
gradle_cache_find_args: &gradle_cache_find_args >-
  . -name "build.gradle*" -o -name "settings.gradle*"
  -o -name "libs.versions.toml" -o -name "gradle-wrapper.properties"

executors:
  android_docker:
    docker:
      - image: cimg/android:2026.10.1
    resource_class: xlarge
  android_machine:
    machine:
      image: android:2026.10.1
    resource_class: xlarge

commands:
  restore_gradle_cache:
    steps:
      - android/restore_gradle_cache:
          find_args: *gradle_cache_find_args
  save_gradle_cache:
    steps:
      - android/save_gradle_cache

jobs:
  lint:
    executor: android_docker
    steps:
      - checkout
      - restore_gradle_cache
      - run: ./gradlew lintDebug
      - save_gradle_cache
      - store_artifacts:
          path: app/build/reports
          destination: reports

  unit_test:
    executor: android_docker
    steps:
      - checkout
      - restore_gradle_cache
      - run: ./gradlew testDebugUnitTest
      - save_gradle_cache
      - store_test_results: # Upload Test Results(Test Insights)
          path: ./app/build/test-results/testDebugUnitTest

  unit_test_parallel:
    executor: android_docker
    parallelism: 4
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Smarter Testing doctor
          command: circleci testsuite doctor "unit tests"
      - run:
          name: Run unit tests (Smarter Testing)
          command: circleci testsuite run "unit tests"
      - save_gradle_cache
      - store_test_results: # Must match outputs.junit-directory in .circleci/test-suites.yml
          path: test-results/unit

  integration_test:
    executor: android_machine
    steps:
      - checkout
      - android/start_emulator_and_run_tests:
          system_image: system-images;android-36;google_apis;x86_64
          # circle-android wait-for-boot waits for the boot animation to finish; with -no-boot-anim
          # it never runs on API 36 images, so the wait step loops until the job times out.
          no_boot_anim: false
          restore_gradle_cache_find_args: *gradle_cache_find_args
      - store_test_results: # Upload Test Results(Test Insights)
          path: ./app/build/outputs/androidTest-results/connected
      - store_artifacts: # connectedDebugAndroidTest builds the debug APK, so every branch gets one
          path: app/build/outputs/apk/debug/app-debug.apk

  beta:
    executor: android_docker
    steps:
      - checkout
      - restore_gradle_cache
      - ruby/install-deps # Ruby(Fastlane)
      - run: ./gradlew assembleDebug
      - store_artifacts: # stored before the Firebase upload, so a failed upload still leaves the APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - run: bundle exec fastlane beta
      - save_gradle_cache

workflows:
  main:
    jobs:
      - lint
      - unit_test:
          requires:
            - lint
      - unit_test_parallel:
          requires:
            - lint
      - integration_test:
          requires:
            - unit_test
            - unit_test_parallel
      - beta:
          requires:
            - integration_test
          context: # Context
            - mobile
          filters: pipeline.git.branch == "main"
